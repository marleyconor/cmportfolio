<svg width="960" height="620" viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect width="960" height="620" fill="#F0F0F0"/>

  <!-- Header -->
  <text x="72" y="72" font-size="28" font-weight="700" fill="#1A1D23">Predicted vs. actual plan mix</text>
  <text x="72" y="100" font-size="15" fill="#70757F">L.E.K. conjoint projection vs. live painted-door A/B test</text>

  <!-- Legend -->
  <circle cx="660" cy="66" r="7" fill="#A9B1BF"/>
  <text x="676" y="71" font-size="14" fill="#4A4F58">L.E.K. predicted</text>
  <circle cx="806" cy="66" r="7" fill="#3B5BDB"/>
  <text x="822" y="71" font-size="14" fill="#4A4F58">Actual</text>

  <!-- Plot area: y 160 (80%) to 520 (0), 4.5 px per % -->
  <!-- Gridlines -->
  <g stroke="#FFFFFF" stroke-width="2">
    <line x1="120" y1="160" x2="900" y2="160"/>
    <line x1="120" y1="250" x2="900" y2="250"/>
    <line x1="120" y1="340" x2="900" y2="340"/>
    <line x1="120" y1="430" x2="900" y2="430"/>
  </g>
  <g font-size="13" fill="#9BA0A8" text-anchor="end">
    <text x="104" y="165">80%</text>
    <text x="104" y="255">60%</text>
    <text x="104" y="345">40%</text>
    <text x="104" y="435">20%</text>
    <text x="104" y="525">0</text>
  </g>

  <!-- Basic: predicted 36% (h=162), actual 71% (h=319.5) -->
  <rect x="176" y="358" width="72" height="162" rx="6" fill="#A9B1BF"/>
  <rect x="264" y="200.5" width="72" height="319.5" rx="6" fill="#3B5BDB"/>
  <text x="212" y="344" font-size="15" font-weight="600" fill="#7A828E" text-anchor="middle">36%</text>
  <text x="300" y="186" font-size="17" font-weight="700" fill="#2B44A8" text-anchor="middle">71%</text>

  <!-- Family: predicted 28% (h=126), actual 16% (h=72) -->
  <rect x="444" y="394" width="72" height="126" rx="6" fill="#A9B1BF"/>
  <rect x="532" y="448" width="72" height="72" rx="6" fill="#3B5BDB"/>
  <text x="480" y="380" font-size="15" font-weight="600" fill="#7A828E" text-anchor="middle">28%</text>
  <text x="568" y="434" font-size="17" font-weight="700" fill="#2B44A8" text-anchor="middle">16%</text>

  <!-- All Access: predicted 36% (h=162), actual 13% (h=58.5) -->
  <rect x="712" y="358" width="72" height="162" rx="6" fill="#A9B1BF"/>
  <rect x="800" y="461.5" width="72" height="58.5" rx="6" fill="#3B5BDB"/>
  <text x="748" y="344" font-size="15" font-weight="600" fill="#7A828E" text-anchor="middle">36%</text>
  <text x="836" y="447" font-size="17" font-weight="700" fill="#2B44A8" text-anchor="middle">13%</text>

  <!-- Baseline -->
  <line x1="120" y1="520" x2="900" y2="520" stroke="#C9CCD2" stroke-width="1.5"/>

  <!-- Tier labels -->
  <g font-size="16" font-weight="600" fill="#33373E" text-anchor="middle">
    <text x="256" y="556">Basic</text>
    <text x="524" y="556">Family</text>
    <text x="792" y="556">All Access</text>
  </g>
</svg>
